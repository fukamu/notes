services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: fukamu_notes_go_test
      POSTGRES_USER: notes_test
      POSTGRES_PASSWORD: notes_test_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes_test -d fukamu_notes_go_test']
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
