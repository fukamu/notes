name: Quality

on:
  pull_request:
    branches:
      - main
      - 'integration/**'
  push:
    branches:
      - main
      - 'integration/**'
      - 'work/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTES_TEST_DATABASE_URL: postgres://notes_test:notes_test_password@127.0.0.1:5432/fukamu_notes_go_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: fukamu_notes_go_test
          POSTGRES_USER: notes_test
          POSTGRES_PASSWORD: notes_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_test -d fukamu_notes_go_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run the shared local verification entry point
        run: npm run verify
