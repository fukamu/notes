name: Quality

on:
  pull_request:
    branches:
      - codex/integration-type-safety-ui
  push:
    branches:
      - codex/integration-type-safety-ui

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run the shared local verification entry point
        run: npm run verify
